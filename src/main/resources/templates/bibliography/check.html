<!-- app/src/main/resources/templates/bibliography/check.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Проверка списка литературы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #e8def0 0%, #d4c4e8 100%);
            min-height: 100vh;
        }

        .container {
            background: white;
            border-radius: 8px;
            padding: 2rem;
        }
        .btn-primary {
            background-color: #7c4d9e;
            border-color: #7c4d9e;
        }

        .btn-primary:hover {
            background-color: #6b3f8a;
            border-color: #6b3f8a;
        }
    </style>
</head>
<body class="py-4">
<div class="container">
    <h1 class="mb-4">Проверка списка литературы</h1>

    <form method="post" th:action="@{/bibliography}">
        <div class="mb-3">
            <label for="sourceText" class="form-label">
                Вставьте список литературы
                <small class="text-muted">(один источник — одна строка)</small>
            </label>
            <textarea class="form-control font-monospace" id="sourceText"
                      name="sourceText" rows="12"
                      th:text="${page != null ? page.originalText() : ''}"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Проверить</button>
    </form>

    <th:block th:if="${page != null}">
        <div class="mt-4">
            <h3>
                Проверено: <span th:text="${page.totalLines()}">0</span> строк,
                ошибок: <span class="text-danger" th:text="${page.totalErrors()}">0</span>,
                не распознано: <span class="text-warning" th:text="${page.linesWithUnknownType()}">0</span>
            </h3>
        </div>

        <div th:each="result : ${page.results()}" class="card mb-2">
            <div class="card-header py-1">
                <strong>Строка [[${result.lineNumber()}]]</strong>
                <span class="badge ms-2" th:classappend="${result.typeDetected()} ? 'bg-secondary' : 'bg-warning text-dark'"
                      th:text="${result.sourceType()}">ТИП</span>
                <span th:if="${!result.hasErrors() && result.typeDetected()}" class="text-success ms-2">✓</span>
            </div>
            <div class="card-body py-2">
                <div class="font-monospace" th:utext="${result.highlightedHtml()}"></div>

                <th:block th:if="${result.hasErrors()}">
                    <div th:each="error : ${result.errors()}" class="mt-2 small">
                        <span class="text-danger">❌</span>
                        <strong th:text="${error.ruleCode()}"></strong>:
                        <span th:text="${error.message()}"></span>
                        <span th:if="${error.expectedView() != null}">
                                → <code th:text="${error.expectedView()}"></code>
                            </span>
                        <span class="text-muted">
                                (поз. [[${error.charStart()}]]–[[${error.charEnd()}]])
                            </span>
                    </div>
                </th:block>
            </div>
        </div>
    </th:block>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
